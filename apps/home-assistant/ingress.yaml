apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: home-assistant
  namespace: home-assistant
  annotations:
    cert-manager.io/cluster-issuer: k3s-node-ca-issuer
spec:
  ingressClassName: traefik # bundled with k3s
  tls:
    - hosts:
        - home-assistant.k3s-node.home
      secretName: home-assistant-tls
  rules:
    - host: home-assistant.k3s-node.home
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: home-assistant
                port:
                  name: http
