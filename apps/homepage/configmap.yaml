# Homepage config. Edit here and push; the pod picks it up on restart
# (kubectl -n homepage rollout restart deploy/homepage). Docs: https://gethomepage.dev
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  namespace: homepage
data:
  settings.yaml: |
    title: k3s-node
    headerStyle: clean
    theme: dark
    color: slate
  services.yaml: |
    - Home:
        - Home Assistant:
            href: https://home-assistant.k3s-node.home
            description: Home automation
            icon: home-assistant.svg
    - Infrastructure:
        - Rancher:
            href: https://k3s-node.home
            description: Cluster management
            icon: rancher.svg
        - Uptime Kuma:
            href: https://uptime-kuma.k3s-node.home
            description: Service monitoring
            icon: uptime-kuma.svg
        - Beszel:
            href: https://beszel.k3s-node.home
            description: Node and container metrics
            icon: beszel.svg
        - Speedtest Tracker:
            href: https://speedtest-tracker.k3s-node.home
            description: Internet speed history
            icon: speedtest-tracker.svg
        - AdGuard Home:
            href: https://adguard-home.k3s-node.home
            description: DNS and ad blocking
            icon: adguard-home.svg
        - Sealed Secrets:
            href: https://sealed-secrets-web.k3s-node.home
            description: Encrypt secrets for git
            icon: mdi-lock
  bookmarks.yaml: |
    - Repo:
        - GitHub:
            - href: https://github.com/Tylerchristensen100/k3s-cluster
              icon: github.svg
  widgets.yaml: |
    - resources:
        cpu: true
        memory: true
        disk: /
  docker.yaml: ""
  kubernetes.yaml: ""
