apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homepage
  namespace: homepage
  annotations:
    cert-manager.io/cluster-issuer: k3s-node-ca-issuer
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - homepage.k3s-node.home
      secretName: homepage-tls
  rules:
    - host: homepage.k3s-node.home
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: homepage
                port:
                  name: http
