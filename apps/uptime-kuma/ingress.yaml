apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: uptime-kuma
  namespace: uptime-kuma
  annotations:
    cert-manager.io/cluster-issuer: k3s-node-ca-issuer
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - uptime-kuma.k3s-node.home
      secretName: uptime-kuma-tls
  rules:
    - host: uptime-kuma.k3s-node.home
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: uptime-kuma
                port:
                  name: http
