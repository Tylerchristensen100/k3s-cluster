apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: adguard-home
  namespace: adguard-home
spec:
  podSelector:
    matchLabels:
      app: adguard-home
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Admin UI / setup wizard: only via Traefik.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 3000
    # DNS from LAN clients (arrives through ServiceLB on the node).
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
  egress:
    # Upstream resolvers (plain DNS, DNS-over-TLS, DNS-over-HTTPS) and
    # filter-list downloads; not other cluster pods/services.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.42.0.0/16
              - 10.43.0.0/16
