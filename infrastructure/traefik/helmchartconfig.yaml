# Customises the Traefik bundled with k3s (see https://docs.k3s.io/helm#customizing-packaged-components-with-helmchartconfig).
# Redirects all HTTP (:80) traffic to HTTPS. Uses the Traefik v3 chart syntax;
# on older k3s (Traefik v2) use `ports.web.redirectTo.port: websecure` instead.
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    ports:
      web:
        redirections:
          entryPoint:
            to: websecure
            scheme: https
            permanent: true
